name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  linux-x64:
    name: Build (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # P3D.sln includes the original VB.NET project (P3D.vbproj, .NET Framework 4.8)
      # which cannot be built by the .NET SDK on Linux. Restore the full solution so
      # NuGet packages and local tools (dotnet-mgcb) are resolved correctly, then build
      # only the C# port project.
      - name: Restore
        run: dotnet restore P3D.sln

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build FontPipeline
        run: dotnet build lib/P3D.FontPipeline/P3D.FontPipeline.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish P3D.CS/P3D.CS.csproj --configuration Release --runtime linux-x64 --self-contained true -o publish

      - name: Confirm binary
        run: test -f publish/Pokemon3D

  win-x64:
    name: Build (Windows x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-win-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-win-

      - name: Restore
        run: dotnet restore P3D.sln

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build FontPipeline
        run: dotnet build lib/P3D.FontPipeline/P3D.FontPipeline.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish P3D.CS/P3D.CS.csproj --configuration Release --runtime win-x64 --self-contained true -o publish

      - name: Confirm binary
        run: test -f publish/Pokemon3D.exe

  osx-x64:
    name: Build (macOS x64)
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore P3D.sln

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build FontPipeline
        run: dotnet build lib/P3D.FontPipeline/P3D.FontPipeline.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish P3D.CS/P3D.CS.csproj --configuration Release --runtime osx-x64 --self-contained true -o publish

      - name: Confirm binary
        run: test -f publish/Pokemon3D

  osx-arm64:
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore P3D.sln

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build FontPipeline
        run: dotnet build lib/P3D.FontPipeline/P3D.FontPipeline.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish P3D.CS/P3D.CS.csproj --configuration Release --runtime osx-arm64 --self-contained true -o publish

      - name: Confirm binary
        run: test -f publish/Pokemon3D

  flatpak:
    name: Build (Flatpak)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-flatpak-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-flatpak-

      - name: Restore
        run: dotnet restore P3D.sln

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build FontPipeline
        run: dotnet build lib/P3D.FontPipeline/P3D.FontPipeline.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish P3D.CS/P3D.CS.csproj --configuration Release --runtime linux-x64 --self-contained true -o linux/publish

      - name: Install Flatpak tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtime and SDK
        run: flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build Flatpak
        run: flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build linux/io.github.wheat32.Pokemon3D.yml

      - name: Confirm build
        run: test -d flatpak-build

  appimage:
    name: Build (AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-appimage-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-appimage-

      - name: Restore
        run: dotnet restore P3D.sln

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build FontPipeline
        run: dotnet build lib/P3D.FontPipeline/P3D.FontPipeline.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish P3D.CS/P3D.CS.csproj --configuration Release --runtime linux-x64 --self-contained true -o AppDir/usr/lib/pokemon3d

      - name: Set up AppDir
        run: |
          cp linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          cp linux/io.github.wheat32.Pokemon3D.desktop AppDir/
          cp linux/io.github.wheat32.Pokemon3D.png AppDir/io.github.wheat32.Pokemon3D.png
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/metainfo AppDir/usr/share/icons/hicolor/256x256/apps
          cp linux/io.github.wheat32.Pokemon3D.desktop AppDir/usr/share/applications/
          cp linux/io.github.wheat32.Pokemon3D.png AppDir/usr/share/icons/hicolor/256x256/apps/
          cp linux/io.github.wheat32.Pokemon3D.metainfo.xml AppDir/usr/share/metainfo/

      - name: Download appimagetool
        run: |
          wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir Pokemon3D.AppImage

      - name: Confirm AppImage
        run: test -f Pokemon3D.AppImage
