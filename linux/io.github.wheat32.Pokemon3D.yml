app-id: io.github.wheat32.Pokemon3D
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: pokemon3d
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=home

modules:
  - name: pokemon3d
    buildsystem: simple
    build-commands:
      - install -d /app/lib/pokemon3d /app/bin
      - cp -a linux/publish/. /app/lib/pokemon3d/
      - chmod +x /app/lib/pokemon3d/Pokemon3D
      - install -Dm755 linux/pokemon3d.sh /app/bin/pokemon3d
      - install -Dm644 linux/io.github.wheat32.Pokemon3D.desktop
          /app/share/applications/io.github.wheat32.Pokemon3D.desktop
      - install -Dm644 linux/io.github.wheat32.Pokemon3D.png
          /app/share/icons/hicolor/256x256/apps/io.github.wheat32.Pokemon3D.png
      - install -Dm644 linux/io.github.wheat32.Pokemon3D.metainfo.xml
          /app/share/metainfo/io.github.wheat32.Pokemon3D.metainfo.xml
    sources:
      - type: dir
        path: ..
